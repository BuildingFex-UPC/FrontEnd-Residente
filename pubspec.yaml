name: frontend_residente
description: "BuildingFex — app de residentes (Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Localized Material widgets (date/time pickers in ES/EN).
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Riverpod) + async networking + local persistence.
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  # Mercado Pago Checkout Pro opens in an in-app WebView.
  webview_flutter: ^4.10.0
  # QR shown to the concierge for guest check-in.
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
